server:
  port: 8085
spring:
#  application:
#    name: demo
  datasource:
    url: jdbc:postgresql://localhost:5432/dbauth
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: never
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_EMAIL}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: localhost
      port: 6379

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration-time: 900000
    refresh-token-expiry-time: 604800000


api:
  product:
    base-url: https://fakestoreapi.com
  order:
    base-url:
  user:
    base-url: http://localhost:8083