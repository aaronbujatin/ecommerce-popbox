server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/orders/**
#              filters:
#                - StripPrefix=1
            - id: user-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/users/**
#              filters:
#                - StripPrefix=1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/popbox/protocol/openid-connect
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration-time: 900000
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true